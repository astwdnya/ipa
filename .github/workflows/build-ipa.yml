name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPASaver (unsigned)
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project IPASaver.xcodeproj -scheme IPASaver

      - name: Build for iOS device (unsigned, Release)
        run: |
          set -euo pipefail
          xcodebuild \
            -project IPASaver.xcodeproj \
            -scheme IPASaver \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | tail -n 40

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -type d -name "IPASaver.app" | head -n 1)
          echo "Found app bundle: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry IPASaver-unsigned.ipa Payload
          ls -lh IPASaver-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPASaver-unsigned-ipa
          path: IPASaver-unsigned.ipa
          if-no-files-found: error
